[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions.extract]
  external_node_modules = ["pdf-parse", "mammoth"]

[functions.study]
  timeout = 26

[functions.study-status]
  timeout = 10

[[redirects]]
  from = "/"
  to = "/app.html"
  status = 301
  force = true

[functions.create-checkout]
  timeout = 10

[functions.stripe-webhook]
  timeout = 10

[functions.set-trial]
  timeout = 10

[functions.grade]
  timeout = 26

[functions.ai-check]
  timeout = 26

# study-background.js is a background function (the "-background" filename suffix
# is what makes it one) — 15-minute limit, so no timeout setting applies.
# The frontend calls it first and polls study-status; the synchronous `study`
# function above stays as the fallback path when background isn't available.

[[redirects]]
  from = "/"
  to = "/app.html"
  status = 301
  force = true

# CORS is set per-function by netlify/functions/lib/guard.js, which echoes back
# only allowed origins. A wildcard header here would override that and hand the
# paid AI endpoints to any site on the internet.
#
# Set ALLOWED_ORIGINS (comma-separated) in the Netlify environment to your real
# domain. Netlify's own URL and DEPLOY_PRIME_URL are trusted automatically, so
# production and deploy previews work without extra configuration.
